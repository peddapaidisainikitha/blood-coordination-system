<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — EBDCS</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    }
    .login-logo { text-align: center; margin-bottom: 30px; }
    .login-logo .icon { font-size: 3rem; }
    .login-logo h2 { color: var(--primary-dark); margin-top: 10px; }
    .login-logo p { color: var(--gray-500); font-size: 0.9rem; }
    .role-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--gray-100);
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .role-tab {
      padding: 10px 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      background: transparent;
      color: var(--gray-500);
      transition: var(--transition);
    }
    .role-tab.active {
      background: white;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .forgot-link { text-align: right; font-size: 0.85rem; margin-top: -10px; margin-bottom: 16px; }
    .forgot-link a { color: var(--primary-light); text-decoration: none; }
    .divider {
      text-align: center;
      margin: 20px 0;
      position: relative;
      color: var(--gray-400);
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--gray-200);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/index.html" class="navbar-brand">
      <div class="brand-icon">🩸</div>
      <div>
        <span class="brand-name">EBDCS</span>
        <span class="brand-sub">Emergency Blood Donation Coordination System</span>
      </div>
    </a>
    <div class="nav-actions">
      <a href="/index.html" class="btn btn-outline btn-sm">← Back to Home</a>
    </div>
  </div>
</nav>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">🩸</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your EBDCS account</p>
    </div>

    <!-- Role Selector -->
    <div class="role-tabs">
      <button class="role-tab active" data-role="patient" onclick="setRole('patient', this)">🏥 Patient</button>
      <button class="role-tab" data-role="donor" onclick="setRole('donor', this)">💉 Donor</button>
      <button class="role-tab" data-role="admin" onclick="setRole('admin', this)">⚙️ Admin</button>
    </div>

    <div id="alertBox" class="hidden"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com"
               data-required autocomplete="email" />
        <div class="form-error" data-error="email"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Password <span class="required">*</span></label>
        <div style="position:relative">
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter password"
                 data-required data-min-length="6" autocomplete="current-password" />
          <button type="button" onclick="togglePassword()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem" title="Show/hide password">👁️</button>
        </div>
        <div class="form-error" data-error="password"></div>
      </div>
      <div class="forgot-link"><a href="#">Forgot Password?</a></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        Sign In
      </button>
    </form>

    <div class="divider">or</div>

    <div style="text-align:center;font-size:0.9rem;color:var(--gray-600)">
      Don't have an account?
      <a href="/pages/register-patient.html" style="color:var(--primary);font-weight:600;text-decoration:none" id="registerLink"> Register as Patient</a>
    </div>

    <div id="donorRegisterNote" class="hidden" style="text-align:center;font-size:0.9rem;color:var(--gray-600);margin-top:10px">
      <a href="/pages/register-donor.html" style="color:var(--secondary);font-weight:600;text-decoration:none">Register as Donor</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
  let selectedRole = 'patient';

  const setRole = (role, btn) => {
    selectedRole = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('registerLink').textContent = role === 'admin' ? '' : ' Register as Patient';
    document.getElementById('registerLink').href = '/pages/register-patient.html';
    document.getElementById('donorRegisterNote').classList.toggle('hidden', role !== 'donor');
  };

  const togglePassword = () => {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  };

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!validateForm(e.target)) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const alertBox = document.getElementById('alertBox');
    alertBox.className = 'hidden';

    try {
      const data = await Auth.login({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        role: selectedRole
      });

      setToken(data.token);
      setUser(data.user);
      showToast('Login successful! Redirecting...', 'success');

      setTimeout(() => {
        const role = data.user.role;
        if (role === 'admin' || role === 'superadmin' || role === 'moderator') {
          window.location.href = '/pages/admin-dashboard.html';
        } else if (role === 'donor') {
          window.location.href = '/pages/donor-dashboard.html';
        } else {
          window.location.href = '/pages/patient-dashboard.html';
        }
      }, 1000);
    } catch (err) {
      alertBox.className = 'alert alert-error';
      alertBox.innerHTML = `❌ ${err.message}`;
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
